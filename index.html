<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FMS Workspace</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="hero">
    <div class="topbar">
      <button class="icon-btn" title="Cloud status">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7 18a5 5 0 0 1-1-9.9A6 6 0 0 1 17.8 7 4.5 4.5 0 0 1 17 16H7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>

      <div class="avatar-badge" id="avatarBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M5 19c1.2-3.2 4-5 7-5s5.8 1.8 7 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <div class="menu-panel" id="menuPanel">
          <button id="logoutBtn">Log out</button>
          <button id="profileBtn">Profile settings</button>
        </div>
      </div>

      <span class="icon-btn-spacer" aria-hidden="true"></span>
    </div>

    <div class="hero-text">
      <h1>FMS Workspace</h1>
      <p>Trio Trend Exports Pvt. Ltd.</p>
    </div>

    <svg class="hero-wave" viewBox="0 0 400 46" preserveAspectRatio="none">
      <path d="M0,18 C55,44 95,0 155,20 C215,40 255,4 315,24 C355,38 380,20 400,26 L400,46 L0,46 Z" fill="#f5f4fb"/>
    </svg>
    <div class="fab-sync" id="syncBtn" title="Sync"></div>
  </div>

  <div class="content">
    <div class="section-label">Line Stages</div>

    <div class="clay-grid">

      <button class="clay-btn" data-label="End of Line" style="--clay-tint:#e8edff; --clay-ic:#5b7cff; --d:0s;">
        <span class="clay-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 3v18" stroke="var(--clay-ic)" stroke-width="1.8" stroke-linecap="round"/><path d="M5 4h6l-1.5 2.5L11 9H5" fill="var(--clay-ic)" fill-opacity="0.9"/><rect x="7" y="4" width="1.6" height="1.6" fill="#fff"/><rect x="10.2" y="4" width="1.6" height="1.6" fill="#fff"/><rect x="8.6" y="5.6" width="1.6" height="1.6" fill="#fff"/></svg>
        </span>
        <span class="clay-label">END OF LINE</span>
      </button>

      <button class="clay-btn" data-label="Edge Paint" style="--clay-tint:#fff1e3; --clay-ic:#ff9a3d; --d:0.08s;">
        <span class="clay-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M14 3l6 6-8 8-6 1 1-6 7-9z" fill="var(--clay-ic)" fill-opacity="0.9"/><path d="M6 18l-1.5 3.5L8 20" stroke="var(--clay-ic)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="clay-label">EDGE PAINT</span>
      </button>

      <button class="clay-btn" data-label="Pre AQL" style="--clay-tint:#e6faf0; --clay-ic:#2fb886; --d:0.16s;">
        <span class="clay-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2.5" stroke="var(--clay-ic)" stroke-width="1.7"/><path d="M9 3h6v2H9z" fill="var(--clay-ic)"/><path d="M8 12h8M8 16h5" stroke="var(--clay-ic)" stroke-width="1.5" stroke-linecap="round"/></svg>
        </span>
        <span class="clay-label">PRE AQL</span>
      </button>

      <button class="clay-btn" data-label="Post AQL" style="--clay-tint:#f3ecff; --clay-ic:#8a5cf6; --d:0.24s;">
        <span class="clay-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2.5" stroke="var(--clay-ic)" stroke-width="1.7"/><path d="M9 3h6v2H9z" fill="var(--clay-ic)"/><path d="M8.5 13.5l2 2 4.5-4.5" stroke="var(--clay-ic)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="clay-label">POST AQL</span>
      </button>

    </div>
  </div>

  <nav class="bottom-nav">
    <button class="active" data-view="home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 11l8-6 8 6v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      Home
    </button>
    <button data-view="reports">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 19V9M11 19V5M17 19v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Reports
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script src="main.js"></script>
</body>
</html>
