<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nimbus — My Files</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="hero">
    <div class="topbar">
      <button class="icon-btn" title="Cloud status">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7 18a5 5 0 0 1-1-9.9A6 6 0 0 1 17.8 7 4.5 4.5 0 0 1 17 16H7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>

      <div class="avatar-badge" id="avatarBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M5 19c1.2-3.2 4-5 7-5s5.8 1.8 7 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <div class="menu-panel" id="menuPanel">
          <button id="logoutBtn">Log out</button>
          <button id="profileBtn">Profile settings</button>
        </div>
      </div>

      <button class="icon-btn" id="menuBtn" title="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="search-bar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="Search files, folders...">
    </div>

    <div class="storage-card">
      <div class="row">
        <div class="file-ico">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 5h9l3 3h4v11H4z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <h3>MyDocs</h3>
          <p id="fileCountLabel">— files, — folders</p>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="storageFill"></div></div>
      <div class="free-label"><span id="freeLabel">— free</span></div>
    </div>
  </div>

  <div class="wave-wrap">
    <svg viewBox="0 0 400 46" preserveAspectRatio="none">
      <path d="M0,18 C55,44 95,0 155,20 C215,40 255,4 315,24 C355,38 380,20 400,26 L400,46 L0,46 Z" fill="#f5f4fb"/>
    </svg>
    <div class="fab-sync" id="syncBtn" title="Refresh">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M4 4v4h4M20 20v-4h-4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div class="content">
    <div class="content-header">
      <div class="label">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/></svg>
        Recents
      </div>
      <div class="view-toggle">
        <button class="active" id="gridBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="currentColor"/></svg>
        </button>
        <button id="listBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <div class="file-grid" id="fileGrid"></div>
    <div class="empty-state" id="emptyState">No files match your search.</div>
  </div>

  <nav class="bottom-nav">
    <button class="active" data-view="home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 11l8-6 8 6v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      Home
    </button>
    <button data-view="recent">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Recent
    </button>
  </nav>

  <div class="clay-overlay" id="clayOverlay">
    <div class="clay-sheet" id="claySheet">
      <div class="clay-handle"></div>
      <div class="clay-sheet-title">Line Menu</div>
      <div class="clay-grid">

        <button class="clay-btn" data-label="End of Line" style="--clay-tint:#e8edff; --clay-ic:#5b7cff;">
          <span class="clay-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 3v18" stroke="var(--clay-ic)" stroke-width="1.8" stroke-linecap="round"/><path d="M5 4h6l-1.5 2.5L11 9H5" fill="var(--clay-ic)" fill-opacity="0.9"/><rect x="7" y="4" width="1.6" height="1.6" fill="#fff"/><rect x="10.2" y="4" width="1.6" height="1.6" fill="#fff"/><rect x="8.6" y="5.6" width="1.6" height="1.6" fill="#fff"/></svg>
          </span>
          <span class="clay-label">END OF LINE</span>
        </button>

        <button class="clay-btn" data-label="Edge Paint" style="--clay-tint:#fff1e3; --clay-ic:#ff9a3d;">
          <span class="clay-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M14 3l6 6-8 8-6 1 1-6 7-9z" fill="var(--clay-ic)" fill-opacity="0.9"/><path d="M6 18l-1.5 3.5L8 20" stroke="var(--clay-ic)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="clay-label">EDGE PAINT</span>
        </button>

        <button class="clay-btn" data-label="Pre AQL" style="--clay-tint:#e6faf0; --clay-ic:#2fb886;">
          <span class="clay-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2.5" stroke="var(--clay-ic)" stroke-width="1.7"/><path d="M9 3h6v2H9z" fill="var(--clay-ic)"/><path d="M8 12h8M8 16h5" stroke="var(--clay-ic)" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <span class="clay-label">PRE AQL</span>
        </button>

        <button class="clay-btn" data-label="Post AQL" style="--clay-tint:#f3ecff; --clay-ic:#8a5cf6;">
          <span class="clay-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2.5" stroke="var(--clay-ic)" stroke-width="1.7"/><path d="M9 3h6v2H9z" fill="var(--clay-ic)"/><path d="M8.5 13.5l2 2 4.5-4.5" stroke="var(--clay-ic)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="clay-label">POST AQL</span>
        </button>

      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="main.js"></script>
</body>
</html>
