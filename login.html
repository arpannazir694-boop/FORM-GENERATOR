<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FMS Workspace — Sign in</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <div class="auth-app">

    <!-- Decorative floating bubbles / rings (purely visual) -->
    <div class="deco deco-circle deco-c1"></div>
    <div class="deco deco-circle deco-c2"></div>
    <div class="deco deco-ring deco-r1"></div>
    <div class="deco deco-ring deco-r2"></div>
    <div class="deco deco-circle deco-c3"></div>
    <div class="deco deco-circle deco-c4"></div>
    <div class="deco deco-sparkle">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z" fill="rgba(255,255,255,0.55)" />
      </svg>
    </div>

    <div class="auth-content">
      <div class="brand">
        <div class="brand-icon">
          <img
            src="https://res.cloudinary.com/dnrgcigsj/image/upload/v1782800322/ChatGPT_Image_Jun_30_2026_11_46_35_AM_s0aosi.png"
            alt="FMS">
        </div>
        <h1><span class="grad-text">FMS</span> Workspace</h1>
        <p>Trio Trend Exports Pvt. Ltd.</p>
      </div>

      <form class="auth-card" id="loginForm">
        <label>Username
          <input type="text" id="username" placeholder="Enter your username" autocomplete="username">
        </label>
        <label>Password
          <div class="pw-wrapper">
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" aria-pressed="false">
              <svg class="pw-icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" stroke="currentColor"
                  stroke-width="1.8" stroke-linejoin="round" />
                <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8" />
              </svg>
              <svg class="pw-icon-hide" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <path
                  d="M10.6 5.14A10.6 10.6 0 0 1 12 5c7 0 10.5 7 10.5 7a15.6 15.6 0 0 1-3.4 4.34M6.7 6.7C3.9 8.4 1.5 12 1.5 12s3.5 7 10.5 7c1.3 0 2.47-.24 3.52-.64"
                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M9.9 9.9a3.2 3.2 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </label>
        <div class="error-msg" id="errorMsg"></div>
        <button type="submit" class="primary-btn">Sign in</button>
      </form>

      <p class="switch-line">Trouble signing in? <a href="#" id="contactAdmin">Contact admin</a></p>
    </div>

    <div class="toast" id="toast"></div>
  </div>
  <script src="main.js"></script>
  <script>
    document.getElementById('contactAdmin').addEventListener('click', (e) => {
      e.preventDefault();
      showToast('Please contact your admin for access');
    });
  </script>
</body>

</html>
