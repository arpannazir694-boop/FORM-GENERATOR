<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FMS Workspace — Sign in</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <div class="auth-app">

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="auth-content">
      <div class="brand">
        <div class="brand-icon">
          <img
            src="https://res.cloudinary.com/dnrgcigsj/image/upload/v1782800322/ChatGPT_Image_Jun_30_2026_11_46_35_AM_s0aosi.png"
            alt="FMS">
        </div>
        <h1><span class="grad-text">FMS</span> Workspace</h1>
        <p>Trio Trend Exports Pvt. Ltd.</p>
      </div>

      <form class="auth-card" id="loginForm">
        <label>Username
          <input type="text" id="username" placeholder="Enter your username" autocomplete="username">
        </label>
        <label>Password
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </label>
        <div class="error-msg" id="errorMsg"></div>
        <button type="submit" class="primary-btn">Sign in</button>
      </form>

      <p class="switch-line">Trouble signing in? <a href="#" id="contactAdmin">Contact admin</a></p>
    </div>

    <div class="toast" id="toast"></div>
  </div>
  <script src="main.js"></script>
  <script>
    document.getElementById('contactAdmin').addEventListener('click', (e) => {
      e.preventDefault();
      showToast('Please contact your admin for access');
    });
  </script>
</body>

</html>
